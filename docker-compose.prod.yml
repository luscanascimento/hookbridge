services:
  hookbridge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookbridge-api-prod
    restart: always
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-hookbridge_prod};Username=${DB_USER:-hookbridge_admin};Password=${DB_PASSWORD}
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
      - EventFlow__BaseUrl=${EVENTFLOW_BASE_URL}
      - EventFlow__ApiKey=${EVENTFLOW_API_KEY}
      - WebhookEncryption__MasterKey=${WEBHOOK_ENCRYPTION_MASTER_KEY}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-HookBridge}
      - Jwt__Audience=${JWT_AUDIENCE:-HookBridgeClients}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-60}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookbridge-net

  hookbridge-web:
    build:
      context: ./src/HookBridge.Web
      dockerfile: Dockerfile
    container_name: hookbridge-web-prod
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - hookbridge-api
    networks:
      - hookbridge-net

  postgres:
    image: postgres:16-alpine
    container_name: hookbridge-postgres-prod
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-hookbridge_prod}
      - POSTGRES_USER=${DB_USER:-hookbridge_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hookbridge_admin} -d ${DB_NAME:-hookbridge_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hookbridge-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hookbridge-rabbitmq-prod
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-hookbridge}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-prod-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hookbridge-net

  redis:
    image: redis:7.4-alpine
    container_name: hookbridge-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hookbridge-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: hookbridge-jaeger-prod
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - hookbridge-net

volumes:
  postgres-prod-data:
  rabbitmq-prod-data:
  redis-prod-data:

networks:
  hookbridge-net:
    driver: bridge
