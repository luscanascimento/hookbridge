name: Release & Container Publishing

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/hookbridge-api
            ghcr.io/${{ github.repository_owner }}/hookbridge-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hookbridge-api:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/hookbridge-api:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/HookBridge.Web
          file: ./src/HookBridge.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hookbridge-web:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/hookbridge-web:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HookBridge Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
